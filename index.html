<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://SYK168.github.io/joemama4/">
    <title>Proxy Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 900px;
            padding: 20px;
            background-color: #222;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .title {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 16px;
        }

        .loading {
            color: #f0f0f0;
            font-size: 14px;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Redirecting...</div>
        <div class="message">Please wait while we load your content.</div>
        <div class="loading">If nothing happens, <a href="https://SYK168.github.io/joemama4/" style="color: #2fa1d6; text-decoration: none;">click here</a> to go directly.</div>
    </div>

    <script>
        // Optional: Delay redirection for a better user experience
        setTimeout(function() {
            window.location.href = "https://SYK168.github.io/joemama4/";
        }, 3000);
    </script>
</body>
</html>
